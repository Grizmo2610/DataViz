[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dataviz"
version = "0.1.2"
description = "Automated data visualization CLI powered by an LLM pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "DataViz Contributors" }
]
keywords = ["dataviz", "cli", "eda", "visualization", "llm", "pandas", "textual"]
dependencies = [
  "pandas>=2.0",
  "openpyxl>=3.1",
  # Charts (VizAgent)
  "altair>=6.0",
  # PDF export (ReportAgent) - headless Chromium, no native GTK/Pango deps
  "playwright>=1.40",
  # Parquet support (ParquetReader)
  "pyarrow>=14.0",
  # TUI interface
  "textual>=0.55",
  # Interactive charts (VizAgent / viz_tools)
  "plotly>=5.0",
  # Notebook exporter
  "nbformat>=5.9",
]

[project.urls]
Homepage = "https://example.com/dataviz"
Issues = "https://example.com/dataviz/issues"
Repository = "https://example.com/dataviz"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
dataviz = "dataviz.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["dataviz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]